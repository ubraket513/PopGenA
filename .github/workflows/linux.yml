name: Linux build, tests and offline workflows
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: System prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential zlib1g-dev libbz2-dev liblzma-dev libssl-dev
      - uses: actions/cache@v4
        with:
          path: .deps/linux
          key: deps-${{ runner.os }}-${{ hashFiles('third_party/src/SHA256SUMS', 'mk/*.mk') }}
      - name: Build (vendored dependencies and popgen)
        run: make
      - name: Unit and integration tests
        run: make check
      - name: Small streaming benchmark
        run: make benchmark
      - name: Offline demos resume without recomputation
        run: |
          for target in workflow genotype reads; do
            make $target >/dev/null
            make $target >/dev/null
          done
          for pair in workflow-demo:2 genotype-demo:15 reads-demo:40; do
            dir=${pair%%:*} expected=${pair##*:}
            .deps/linux/prefix/bin/jq -e --argjson n "$expected" '.reused_tasks == $n and .scheduled_tasks == 0' "work/$dir/last-run.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-results
          path: |
            work/*-demo/plan.json
            work/*-demo/state
            work/*-demo/last-run.json
            work/*-demo/logs
            work/benchmark-linux-*/benchmark.json
