name: Native Windows build, genotype workflows and acquisition checks
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache
          key: windows-ucrt64-${{ hashFiles('tools/windows-packages.lock.json', 'tools/plink2.lock.json') }}
      - name: Bootstrap pinned native packages
        run: ./tools/bootstrap.ps1
      - name: Build and check
        run: ./make.ps1 check
      - name: Clean rebuild and offline demo
        run: |
          ./make.ps1 clean
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./make.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./make.ps1 run
      - name: Offline workflow and resume
        run: |
          ./make.ps1 workflow
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./make.ps1 workflow
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $run = Get-Content work/workflow-demo/last-run.json -Raw | ConvertFrom-Json
          if ($run.reused_tasks -ne 2 -or $run.scheduled_tasks -ne 0) { throw 'Workflow did not resume without recomputation' }
      - name: Genotype QC and PCA demo resume
        run: |
          ./make.ps1 genotype
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./make.ps1 genotype
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $run = Get-Content work/genotype-demo/last-run.json -Raw | ConvertFrom-Json
          if ($run.reused_tasks -ne 15 -or $run.scheduled_tasks -ne 0) { throw 'Genotype workflow did not resume' }
      - name: Git Bash CLI entry
        shell: bash
        run: |
          bash ./make.sh help
          bash ./popgen --version
          bash ./popgen doctor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-results
          path: |
            out/demo
            work/workflow-demo/plan.json
            work/workflow-demo/state
            work/workflow-demo/last-run.json
            work/workflow-demo/logs
            work/genotype-demo/plan.json
            work/genotype-demo/state
            work/genotype-demo/last-run.json
            work/genotype-demo/logs
